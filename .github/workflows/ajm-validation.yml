name: AJM Reborn POS validation

on:
  push:
    branches:
      - main
      - feature/supabase-multidevice-foundation
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript and staged contracts
        run: node scripts/validate-ajm.mjs
