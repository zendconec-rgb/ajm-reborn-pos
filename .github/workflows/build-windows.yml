name: Build AJM Reborn POS for Windows

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "electron/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest AJM Reborn POS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer and portable EXE
        run: npm run build:win

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: AJM-Reborn-POS-Windows-${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: AJM Reborn POS Windows Build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: dist/*.exe
